<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #f8f9fa;
        }

        .main-content {
            flex: 1;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">💊 MediReminder</a>
  </div>
</nav>

<!-- MAIN -->
<div class="container main-content mt-5">

    <h2 class="text-center mb-4">Add Medicine</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">

                <!-- Medicine Name -->
                <div class="mb-3">
                    <label class="form-label">Medicine Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter medicine name">
                </div>

                <!-- Time -->
                <div class="mb-3">
                    <label class="form-label">Time</label>
                    <input type="time" id="time" class="form-control">
                </div>

                <!-- Button -->
                <div class="text-center">
                    <button class="btn btn-success px-4" onclick="saveMedicine()">
                        <i class="bi bi-save"></i> Save
                    </button>
                </div>

            </div>

        </div>
    </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-auto">
  © 2026 MediReminder | Stay Healthy 💊
</footer>

<!-- JS -->
<script src="js/script.js"></script>

</body>
</html>
