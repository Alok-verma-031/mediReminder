<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediReminder</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            display: flex;
    flex-direction: column;
    min-height: 100vh;
        }
        .card {
            border-radius: 15px;
            transition: 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .icon {
            font-size: 40px;
        }
        
    </style>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">💊 MediReminder</a>
  </div>
</nav>

<!-- MAIN -->
<div class="container text-center mt-5">

    <h1 class="mb-3">Stay Healthy 💊</h1>
    <p class="text-muted">Never miss your medicine on time</p>

    <div class="row mt-5">

        <!-- Add Medicine -->
        <div class="col-md-4 mb-4">
            <div class="card shadow p-4">
                <i class="bi bi-capsule icon text-primary"></i>
                <h5 class="mt-3">Add Medicine</h5>
                <a href="add.html" class="btn btn-primary mt-2">Open</a>
            </div>
        </div>

        <!-- Schedule -->
        <div class="col-md-4 mb-4">
            <div class="card shadow p-4">
                <i class="bi bi-clock icon text-success"></i>
                <h5 class="mt-3">View Schedule</h5>
                <a href="schedule.html" class="btn btn-success mt-2">Open</a>
            </div>
        </div>

        <!-- About -->
        <div class="col-md-4 mb-4">
            <div class="card shadow p-4">
                <i class="bi bi-info-circle icon text-warning"></i>
                <h5 class="mt-3">About</h5>
                <a href="about.html" class="btn btn-warning mt-2">Open</a>
            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-auto">
  © 2026 MediReminder | Stay Healthy 💊
</footer>

</body>
</html>
